<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a4b42" />
    <title>好友麻将</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="site-header">
        <div><span class="eyebrow">手机在线</span><h1>好友麻将</h1></div>
        <span id="connection" class="status">连接中</span>
      </header>

      <section id="lobby" class="card">
        <h2>一起开一桌</h2>
        <p class="muted">输入昵称后开房，朋友用六位房间号加入。</p>
        <label>你的昵称<input id="name" maxlength="12" autocomplete="nickname" placeholder="例如：老张" /></label>
        <button id="create" class="primary">创建房间</button>
        <div class="divider"><span>或加入朋友的房间</span></div>
        <label>六位房间号<input id="room-code" inputmode="numeric" maxlength="6" placeholder="000000" /></label>
        <button id="join">加入房间</button>
      </section>

      <section id="room" class="card hidden">
        <div class="room-title">
          <div><span class="muted">房间号</span><strong id="current-code">------</strong></div>
          <button id="copy" class="compact">复制房间号</button>
        </div>
        <div id="seats" class="seats"></div>
        <button id="ready" class="primary">准备</button>
        <button id="fill-test" class="test-button">一键补齐测试玩家</button>
        <button id="start" class="primary hidden">开始游戏</button>
        <p class="hint">单人联调可补齐三名测试玩家；开局后测试玩家会自动摸牌和出牌。</p>
      </section>

      <p id="notice" class="notice" aria-live="polite"></p>
    </main>

    <section id="game-screen" class="game-screen hidden" aria-label="麻将桌">
      <div class="table-board">
        <div class="table-hud">
          <div class="hud-room"><span>房间</span><strong id="game-room-code">------</strong></div>
          <div id="round-label" class="round-label">第1局</div>
          <span id="game-connection" class="status">连接中</span>
        </div>

        <div id="table-seats" class="table-seats"></div>
        <div id="wall-bottom" class="tile-wall wall-bottom" aria-hidden="true"></div>
        <div id="wall-right" class="tile-wall wall-right" aria-hidden="true"></div>
        <div id="wall-top" class="tile-wall wall-top" aria-hidden="true"></div>
        <div id="wall-left" class="tile-wall wall-left" aria-hidden="true"></div>

        <div id="discards-bottom" class="discard-zone discards-bottom"></div>
        <div id="discards-right" class="discard-zone discards-right"></div>
        <div id="discards-top" class="discard-zone discards-top"></div>
        <div id="discards-left" class="discard-zone discards-left"></div>

        <div id="center-console" class="center-console">
          <span id="wind-top" class="center-wind wind-top">北</span>
          <span id="wind-right" class="center-wind wind-right">西</span>
          <span id="wind-bottom" class="center-wind wind-bottom">东</span>
          <span id="wind-left" class="center-wind wind-left">南</span>
          <div class="wall-count"><strong id="wall-status">83</strong><span>余牌</span></div>
          <div id="turn-status" class="turn-status">等待开局</div>
        </div>

        <div id="operation-panel" class="operation-panel hidden" aria-label="可选操作"></div>
        <div class="self-area">
          <div id="self-hand" class="self-hand" aria-label="我的手牌"></div>
        </div>
        <p id="game-notice" class="game-notice" aria-live="polite"></p>
        <div class="rotate-tip">请横屏体验牌桌</div>
      </div>
    </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
